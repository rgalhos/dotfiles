# BACKGROUND
background {
    monitor =
    path = ~/Pictures/W/moonlight-floating-saturn-4k-with-imagegonord-v0-f1sahmfwagkb1.png
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = false
    grace = 5
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.2)
    font_color = $foreground
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <b><span foreground="##cba6f7">*  ‧̍̊˙· 𓆝.° ｡˚𓆛˚｡ °.𓆞 ·˙‧̍̊</span></b>
    dots_text_format = 😺
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-H:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}



# Profile Picture
image {
    monitor =
    path = 
    size = 100
    border_size = 2
    border_color = $foreground
    position = 0, -100
    halign = center
    valign = center
}

# Desktop Environment
image {
    monitor =
    path = 
    size = 75
    border_size = 2
    border_color = $foreground
    position = -50, 50
    halign = right
    valign = bottom
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl -p spotify metadata --format '\{\{ trunc(title, 30) }}')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 18
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 10, 20
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl -p spotify metadata --format '\{\{ artist }}')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 14
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 10, 0
    halign = left
    valign = bottom
}

image {
    monitor =
    path = /tmp/cover
    border_size = 2
    border_color = rgba(205, 214, 244, 0)
    size = 150
    rounding = 14
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 10, 52
    halign = left
    valign = bottom
}
